# 每日更新 GeoIP：先下载到仓库根目录，再复制到 cdnfly/（安装脚本从此路径拉取）
name: Update GeoIP

on:
  schedule:
  - cron: '0 19 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  update-geoip:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout main
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Download to repo root, then copy to cdnfly/
      run: |
        set -euo pipefail
        URL="https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-Country.mmdb"
        ROOT_FILE="GeoLite2-Country.mmdb"
        CDN_FILE="cdnfly/GeoLite2-Country.mmdb"

        rm -f "$ROOT_FILE"
        curl -fLo "$ROOT_FILE" --connect-timeout 30 --retry 5 "$URL"

        if [ ! -s "$ROOT_FILE" ]; then
          echo "Download failed or empty file."
          exit 1
        fi

        mkdir -p cdnfly
        cp -f "$ROOT_FILE" "$CDN_FILE"
        ls -lh "$ROOT_FILE" "$CDN_FILE"

    - name: Commit and push
      run: |
        set -euo pipefail
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
        git add GeoLite2-Country.mmdb cdnfly/GeoLite2-Country.mmdb

        if git diff --cached --quiet; then
          echo "GeoIP already up to date (root and cdnfly match previous commit)."
          exit 0
        fi

        git commit -m "Update GeoIP: $(date -u +%Y-%m-%d) [skip ci]"
        git pull --rebase origin main
        git push origin HEAD:main
