# Example: block unauthenticated REST API on the public site / login vhost.
# Place inside the server { } that serves your panel user or admin login domain.
# Adjust server_name to match 系统设置 → 用户相关 → user_domain / admin_domain.
#
# CDNFLY 5.1.13: /v1/ is used by api_key REST clients; blocking here is a
# documented mitigation when the backend cannot be upgraded.

location ~ ^/v1/ {
    deny all;
    return 403;
}

# Optional: still allow panel console (not under /v1/) from same vhost.
# Use a separate admin vhost with stricter source IP allowlist when possible.